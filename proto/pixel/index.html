<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pixel Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" />
<style>
  :root { --bg:#1d1828; --panel:#2b2438; --edge:#0f0c16; --text:#f4eefc; --muted:#a79fbd;
          --research:#4a9eff; --code:#3ecf6e; --bug:#ff5a5a; --accent:#8a7cff; --gold:#e8b94a; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.3 'Pixelify Sans', system-ui, sans-serif; overflow:hidden; }
  #wrap { position:fixed; inset:0; display:grid; place-items:center; }
  canvas { image-rendering:pixelated; display:block; box-shadow:0 0 0 4px var(--edge), 0 12px 0 4px #0006; }
  .hud { position:fixed; top:12px; left:12px; right:12px; display:flex; gap:8px; flex-wrap:wrap; pointer-events:none; }
  .counter { display:flex; align-items:center; gap:8px; padding:5px 10px; background:var(--panel); border:3px solid var(--edge); box-shadow:inset 0 -3px 0 #0004; }
  .counter i { width:10px; height:10px; }
  .counter b { font-weight:600; font-size:18px; min-width:2ch; text-align:right; }
  .status { width:100%; color:var(--muted); font-size:13px; }
  .bump { animation:bump .25s steps(3); } @keyframes bump { 50% { transform:translateY(-3px); } }
  .controls { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); display:flex; gap:4px; flex-wrap:wrap; justify-content:center;
              padding:5px; background:var(--panel); border:3px solid var(--edge); max-width:calc(100% - 32px); }
  .controls button { font:inherit; font-size:14px; color:var(--text); background:#3a3150; border:0; box-shadow:inset 0 -3px 0 #0005; padding:5px 9px; cursor:pointer; }
  .controls button:active { transform:translateY(1px); }
  .controls button.on { background:var(--accent); }
  .bubble { position:fixed; left:0; top:0; width:20px; height:20px; margin:-10px 0 0 -10px; border:3px solid var(--edge);
            display:grid; place-items:center; font:600 11px/1 'Pixelify Sans', monospace; color:#fff; pointer-events:none; z-index:5; }
  .tag, .say { position:fixed; left:0; top:0; pointer-events:none; white-space:nowrap; border:3px solid var(--edge); }
  .tag { padding:1px 6px; font-size:12px; font-weight:600; color:#2b1d05; background:var(--gold); }
  .say { padding:3px 8px; font-size:13px; color:#1d1a24; background:#fff; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; color:var(--muted); }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen"></canvas></div>
<div id="loading">Loading pixels…</div>
<div class="hud">
  <div class="counter" id="c-research"><i style="background:var(--research)"></i>Research <b>0</b></div>
  <div class="counter" id="c-code"><i style="background:var(--code)"></i>Code <b>0</b></div>
  <div class="counter" id="c-bug"><i style="background:var(--bug)"></i>Bugs <b>0</b></div>
  <nav style="margin-left:auto;display:flex;border:3px solid var(--edge);pointer-events:auto"><a href="./index.html" style="color:var(--text);text-decoration:none;padding:4px 10px;background:var(--accent)">Office</a><a href="./tower.html" style="color:var(--text);text-decoration:none;padding:4px 10px;background:#3a3150">Tower</a><a href="./grid.html" style="color:var(--text);text-decoration:none;padding:4px 10px;background:#3a3150">Grid</a></nav>
  <div class="status" id="status">Pixel prototype · simulated events</div>
</div>
<div class="tag" id="boss-tag">BOSS</div>
<div class="controls">
  <button id="b-work" class="on">Working</button>
  <button id="b-idle">Waiting for input</button>
  <button id="b-spawn">+ Subagent</button>
  <button id="b-done">Subagent done</button>
  <button id="b-boss">Boss check-in</button>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
